name: Release

# Two ways to release (both build the zip and attach it to a GitHub Release):
#   1. Push a semantic version tag: v1.0.0, or v1.1.0-rc.1 for a pre-release.
#   2. Actions → Release → Run workflow, enter the version (e.g. 1.0.0). The
#      workflow tags the current commit itself.
# Releases are immutable artifacts: deploys and rollbacks use these zips,
# never a branch.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 1.0.0 or 1.1.0-rc.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Tag matches plugin version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then echo "Not a semantic version: $TAG"; exit 1; fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists"; exit 1
          fi
          tag="${TAG#v}"
          header=$(grep -m1 -E '^ \* Version:' river-conditions.php | awk '{print $NF}')
          const=$(grep -m1 -E "^const VERSION" river-conditions.php | grep -oE "'[^']+'" | tr -d "'")
          stable=$(grep -m1 -E '^Stable tag:' readme.txt | awk '{print $NF}')
          echo "tag=$tag header=$header const=$const readme=$stable"
          test "$tag" = "$header" && test "$tag" = "$const"
          # readme.txt Stable tag tracks stable releases only.
          if [[ "$tag" != *-* ]]; then test "$tag" = "$stable"; fi
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Regenerate translation template
        run: composer make-pot
      - run: npm ci
      - run: npm run build
      - run: npm run plugin-zip
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv river-conditions.zip "river-conditions-${TAG}.zip"
          flags="--generate-notes"
          # A pushed tag must already exist; a manual run creates it on this commit.
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then flags="$flags --verify-tag"; else flags="$flags --target $GITHUB_SHA"; fi
          if [[ "$TAG" == *-* ]]; then flags="$flags --prerelease"; fi
          gh release create "$TAG" "river-conditions-${TAG}.zip" --title "River Conditions ${TAG}" $flags
